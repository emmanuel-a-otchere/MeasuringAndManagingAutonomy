# Autonomy Ledger — AI agent units (v1 format, see docs/ledger-format.md)
# Companion to docs/agents-as-units.md (worked mini-example in its §7).
# Agent contracts live in the same ledger as human ones; the schema is
# unchanged. Replace with your own.
schema: 1

contracts:
  # --- Worked example: refund agent, expanded from L1 to guardrailed L2 ---
  - id: refund-agent-v2
    unit: support-refund-agent
    domain: customer-refunds
    level: 2
    scope: >
      Refund decisions on support tickets: approve/execute up to $200 from an
      allow-list of refund reasons; 100-200 held for human review; >$200 or
      off-list reasons escalate before execution.
    guardrails:
      - Hard $200 per-action cap enforced at the checkout API, not the prompt
      - $2,000/day aggregate cap enforced by the payments client
      - Allow-list of refund reasons; off-list requires escalation
      - Hold-for-review class for amounts > $100
    telemetry:
      - Structured decision log per refund (input, output, policy version, cost)
      - Spend/refusal/escalation-rate dashboard, grantor-visible
      - Anomaly alerts routed to grantor automatically
    revocation_triggers:
      - Any guardrail trip without a matching drill (auto step-down to L0)
      - Spend above either cap
      - Eval pass-rate drop > 5 points on a policy release
      - Prompt/policy change without re-assessment
    escalation: support-lead -> support-director, 1-hour SLA business hours
    grantor: support-director
    horizon: 2026-03-31
    last_review: 2025-12-15
    review_cadence_days: 90
    status: active
    notes: >
      v1 ran at L1 inform-after ($50 cap). First assessment scored
      D1-D6 = 3,3,2,3,2,2; safe level L2 (docs/agents-as-units.md §7).
      Expanded to guardrailed L2 with drilled step-down; escalation path
      exercised once (D6 re-check next horizon).

  # --- Second entry: draft-stage agent, not yet assessed ------------------
  - id: docs-agent-v1
    unit: internal-docs-agent
    domain: knowledge-base-writes
    level: 1
    scope: >
      Drafting and updating internal knowledge-base pages; publishes only to
      the staging space, production publish requires editor approval.
    guardrails:
      - Staging-space write allow-list enforced by the CMS token
      - Every page version attributed to the agent and reviewable
    telemetry:
      - Change log per page with diff links, reviewed weekly
    revocation_triggers:
      - Two consecutive weekly reviews finding unattributed or wrong content
      - Any write outside the staging space
    escalation: docs-lead -> head-of-platform, next business day
    grantor: head-of-platform
    horizon: 2026-06-30
    last_review: 2026-01-20
    review_cadence_days: 90
    status: draft
    notes: >
      First contract, still draft: D1/D5 unassessed, no eval suite yet (D2).
      Stay at L1 until the assessment produces evidence; do not expand on
      impression.
