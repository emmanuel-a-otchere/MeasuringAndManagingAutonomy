[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "measuring-autonomy"
version = "2.1.1"
description = "Measure and manage autonomy: safe-level scoring, Autonomy Ledger health checks, and framework tooling."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Emmanuel A. Otchere" }]
keywords = ["autonomy", "governance", "maturity-model", "management", "org-design"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=5.4"]

[project.urls]
Homepage = "https://github.com/emmanuel-a-otchere/measuring-and-managing-autonomy"
Changelog = "https://github.com/emmanuel-a-otchere/measuring-and-managing-autonomy/blob/main/CHANGELOG.md"

[project.scripts]
autonomy-score = "measuring_autonomy.score:main"
ledger-health = "measuring_autonomy.ledger:main"

[tool.setuptools.packages.find]
where = ["src"]
