name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tool self-test & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile check (all tooling)
        run: |
          python3 -m compileall -q tools
          echo "compile: OK"

      - name: Run autonomy_score self-test
        run: python3 tools/autonomy_score.py --self-test

      - name: Run ledger_health self-test
        run: python3 tools/ledger_health.py --self-test

      - name: Smoke-test CLI output
        run: |
          python3 tools/autonomy_score.py 1 3 2 2 1 1 --current 1
          python3 tools/autonomy_score.py 2 3 3 3 2 2 --current 2 --json > /dev/null

      - name: Validate reference ledger
        run: python3 tools/ledger_health.py examples/ledger.yaml --today 2025-10-01

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hotlinked external images
        run: |
          if grep -rEn '!\[[^]]*\]\(https?://' --include='*.md' .; then
            echo "::error::Markdown files must not hotlink external images; store them in the repo"
            exit 1
          fi
          echo "image check: OK"

      - name: Check internal doc links resolve
        run: |
          python3 - <<'EOF'
          import os, re, sys, urllib.parse
          failures = []
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if not d.startswith(('.git', '.vibe'))]
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  path = os.path.join(root, f)
                  text = open(path, encoding='utf-8').read()
                  for m in re.finditer(r'\[[^\]]*\]\(([^)#]+?)(#[^)]*)?\)', text):
                      target = urllib.parse.unquote(m.group(1))
                      if target.startswith(('http://', 'https://', 'mailto:')):
                          continue
                      resolved = os.path.normpath(os.path.join(root, target))
                      if not os.path.exists(resolved):
                          failures.append(f"{path}: broken link -> {target}")
          if failures:
              for f_ in failures:
                  print(f"::error::{f_}")
              sys.exit(1)
          print(f"link check: OK")
          EOF
