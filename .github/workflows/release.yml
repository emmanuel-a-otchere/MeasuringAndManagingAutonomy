name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-python:
    name: Wheel + sdist, smoke-tested
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          python3 -m pip install --quiet build
          python3 -m build

      - name: Smoke-test the wheel in a fresh venv
        run: |
          python3 -m venv /tmp/reltest
          /tmp/reltest/bin/pip install --quiet dist/*.whl
          /tmp/reltest/bin/autonomy-score --self-test
          /tmp/reltest/bin/ledger-health --self-test
          /tmp/reltest/bin/autonomy-score 1 3 2 2 1 1 --current 1
          /tmp/reltest/bin/autonomy-score 2 3 3 3 2 2 --current 2 --json > /dev/null
          /tmp/reltest/bin/ledger-health examples/ledger.yaml --today 2025-10-01

      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  binaries:
    name: Standalone binaries (${{ matrix.osname }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   osname: macos,   arch: arm64 }
          - { os: ubuntu-latest,  osname: linux,   arch: x86_64 }
          - { os: windows-latest, osname: windows, arch: x86_64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build one-file binaries
        run: |
          python3 -m pip install --quiet .
          python3 -m pip install --quiet pyinstaller
          pyinstaller --onefile --clean --name autonomy-score src/measuring_autonomy/score.py
          pyinstaller --onefile --clean --name ledger-health src/measuring_autonomy/ledger.py

      - name: "Gate: self-test + CLI smoke on the built binaries"
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          ./dist/autonomy-score$ext --self-test
          ./dist/ledger-health$ext --self-test
          ./dist/autonomy-score$ext 1 3 2 2 1 1 --current 1 > /dev/null
          ./dist/ledger-health$ext examples/ledger.yaml --today 2025-10-01

      - name: Platform-suffixed release copies
        shell: bash
        run: |
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          cp dist/autonomy-score$ext dist/autonomy-score-${{ matrix.osname }}-${{ matrix.arch }}$ext
          cp dist/ledger-health$ext  dist/ledger-health-${{ matrix.osname }}-${{ matrix.arch }}$ext

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.osname }}-${{ matrix.arch }}
          path: |
            dist/autonomy-score-*
            dist/ledger-health-*

  publish:
    name: GitHub Release
    needs: [build-python, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Make binaries executable
        run: find assets -type f ! -name '*.exe' ! -name '*.whl' ! -name '*.tar.gz' -exec chmod +x {} +

      - name: Extract changelog notes for this version
        run: |
          python3 - <<'EOF'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"(?ms)^## v{re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text)
          if not m:
              sys.exit(f"error: no CHANGELOG.md section for v{version}")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
